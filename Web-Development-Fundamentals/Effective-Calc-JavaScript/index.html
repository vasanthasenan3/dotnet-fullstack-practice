
<!DOCTYPE html>
<html>
<head>
    <title>Colorful Calculator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="calculator">

            <h2 class="calculator-title">My Calculator</h2>

            <!-- Display -->
            <input type="text"
                   id="display"
                   class="form-control"
                   readonly>

            <!-- Buttons -->
            <div class="row g-2 mt-3">

                <!-- Row 1 -->
                <div class="col-3">
                    <button class="btn btn-clear w-100"
                            onclick="clearDisplay()">C</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100"
                            onclick="addValue('7')">7</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100"
                            onclick="addValue('8')">8</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-operator w-100"
                            onclick="addValue('/')">÷</button>
                </div>


                <!-- Row 2 -->
                <div class="col-3">
                    <button class="btn btn-number w-100"
                            onclick="addValue('4')">4</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100"
                            onclick="addValue('5')">5</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100"
                            onclick="addValue('6')">6</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-operator w-100"
                            onclick="addValue('*')">×</button>
                </div>


                <!-- Row 3 -->
                <div class="col-3">
                    <button class="btn btn-number w-100"
                            onclick="addValue('1')">1</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100"
                            onclick="addValue('2')">2</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100"
                            onclick="addValue('3')">3</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-operator w-100"
                            onclick="addValue('-')">−</button>
                </div>


                <!-- Row 4 -->
                <div class="col-6">
                    <button class="btn btn-number w-100"
                            onclick="addValue('0')">0</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-number w-100"
                            onclick="addValue('.')">.</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-operator w-100"
                            onclick="addValue('+')">+</button>
                </div>


                <!-- Equal -->
                <div class="col-12">
                    <button class="btn btn-equal w-100"
                            onclick="calculate()">=</button>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
